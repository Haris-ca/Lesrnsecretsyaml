name: CI-Pipeline

on: 
  push: 
    branches: [ main ]
  pull_request: 
    branches: [ main ]
  workflow_dispatch: 

env:
  NODE_VERSION: '20'

jobs:
  Buiild&Test:
    name: Build and test runner
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sample-app
    steps:
      - name: downloload the code to the runner
        uses: actions/checkout@v5

      - name: Set up Node. js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'sample-app/package-lock.json'
      - name: Install Dependencies
        run: npm install

      - name: LINT
        run: npm run lint

      - name: Run Tests
        run: npm test
      - name: Summary
        run: |
          echo  "Pipeline finished for commit ${{github.sha}}."
        
      
